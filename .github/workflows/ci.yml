name: Repository validation

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  integrity:
    name: Repository integrity
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install validation dependencies
        run: python -m pip install pandas numpy scikit-learn imbalanced-learn iterative-stratification>=0.1.9

      - name: Compile source and scripts
        run: python -m compileall -q src scripts

      - name: Run repository validation tests
        run: python -m unittest discover -s tests -p "test_*.py" -v
